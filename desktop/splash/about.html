<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Farhad Flow CI</title>
    <style>
      :root {
        --bg0: #070b14;
        --bg1: #0b1220;
        --fg: #f4f7fb;
        --muted: #9aa8bc;
        --line: rgba(244, 247, 251, 0.12);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(900px 480px at 50% -20%, #15233a 0%, var(--bg0) 60%);
        color: var(--fg);
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .card {
        width: min(360px, 92vw);
        text-align: center;
        padding: 1.75rem 1.25rem 1.5rem;
      }
      .logo {
        width: min(200px, 70vw);
        margin: 0 auto 1.25rem;
        color: var(--fg);
      }
      .logo img {
        width: 100%;
        height: auto;
        display: block;
        filter: brightness(0) invert(1);
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 650;
      }
      .meta {
        margin: 0.55rem 0 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .ver {
        margin-top: 1.1rem;
        padding-top: 0.9rem;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.8rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      #version {
        color: var(--fg);
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true">
        <img src="./assets/zeenome-logo.svg" alt="" />
      </div>
      <h1>Farhad Flow CI</h1>
      <p class="meta">Zeenome · staff desktop shell</p>
      <p class="ver">Version <span id="version">…</span></p>
    </main>
    <script>
      window.__farhadAbout = {
        setVersion(v) {
          const el = document.getElementById("version");
          if (el && typeof v === "string") el.textContent = v;
        },
      };
      // Native shell injects package / tauri.conf version after load.
      if (typeof window.__FARHAD_FLOW_CI_VERSION__ === "string") {
        window.__farhadAbout.setVersion(window.__FARHAD_FLOW_CI_VERSION__);
      }
    </script>
  </body>
</html>
